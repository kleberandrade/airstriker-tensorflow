[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "airstriker-tensorflow"
version = "0.3.0"
description = "Educational TensorFlow Q-learning experiment for Airstriker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{name = "Kléber de Oliveira Andrade"}]
dependencies = ["tensorflow==2.21.0", "numpy==2.5.5", "Pillow==13.0.0"]

[project.optional-dependencies]
retro = ["stable-retro==1.0.1"]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.5", "build==1.6.1"]

[project.scripts]
airstriker-tf = "airstriker_tensorflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
