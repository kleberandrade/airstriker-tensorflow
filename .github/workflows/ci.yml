name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: pytest --cov=airstriker_tensorflow --cov-report=term-missing --cov-report=lcov
      - run: python examples/smoke.py
      - run: python examples/analyze_experiment.py --source docs/experiments/2026-11-16-airstriker-long --output runs/ci-report --window 1000
      - run: python -m build --no-isolation
